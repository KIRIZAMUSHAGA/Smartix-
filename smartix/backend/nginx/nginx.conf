# ─── Vibe-Coding Nginx — Configuration principale ────────────────────────────
#
# Reverse proxy pour :
#   - API Backend (port 8000)
#   - Frontend React (port 5000)
#   - Sous-domaines sandbox dynamiques *.vibe.app
#   - Challenge Let's Encrypt (/.well-known/acme-challenge/)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ── Performances ─────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript text/xml;
    gzip_min_length    1000;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options           SAMEORIGIN;
    add_header X-XSS-Protection          "1; mode=block";
    add_header X-Content-Type-Options    nosniff;
    add_header Referrer-Policy           "strict-origin-when-cross-origin";
    server_tokens off;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=sandbox:10m rate=5r/s;

    # ── Upstream Backend ─────────────────────────────────────────────────────
    upstream backend {
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend {
        server frontend:5000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ── Serveur HTTP (redirection + ACME challenge) ────────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirection HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Sous-domaines sandbox *.vibe.app ──────────────────────────────────
    server {
        listen 80;
        server_name ~^(?<subdomain>[a-z0-9-]+)\.vibe\.app$;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Inclure les configurations SSL ────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
