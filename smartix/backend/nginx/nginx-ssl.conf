# ─── Vibe-Coding Nginx SSL — HTTPS + Sandbox routing ────────────────────────
#
# Gère :
#   - HTTPS pour app.vibe.app (frontend + API)
#   - HTTPS wildcard pour *.vibe.app (containers sandbox)
#   - WebSocket upgrades (terminal PTY, collaboration, logs)

# ── Application principale : app.vibe.app ─────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.vibe.app;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/vibe.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibe.app/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── API Backend ─────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── WebSocket (Terminal PTY, LSP, Collaboration) ─────────────────────
    location /ws/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Frontend React ───────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── Sandbox containers : *.vibe.app ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name ~^(?<subdomain>[a-z0-9-]+)\.vibe\.app$;

    # Wildcard certificate
    ssl_certificate     /etc/letsencrypt/live/vibe.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibe.app/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Headers de sécurité sandbox
    add_header X-Frame-Options DENY;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;";

    # Rate limiting sandbox
    limit_req zone=sandbox burst=10 nodelay;

    location / {
        # Résolution dynamique du container par sous-domaine
        resolver 127.0.0.11 valid=10s;
        set $upstream "vibe-${subdomain}:3000";

        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;

        # Fallback si le container est down
        error_page 502 503 = @container_offline;
    }

    location @container_offline {
        default_type application/json;
        return 503 '{"error":"Container hors ligne","message":"Le projet est en cours de démarrage..."}';
    }
}
