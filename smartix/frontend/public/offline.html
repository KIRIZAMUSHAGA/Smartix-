<!DOCTYPE html>
<html lang="fr">
<head>

    <title>Hors ligne - Smartix</title>
    <style>
        body {
            background: #0f172a;
            color: white;

        }
        .container { max-width: 400px; padding: 20px; }

            cursor: pointer;

        <div class="icon">📡</div>

        <button onclick="location.reload()">Réessayer</button>
