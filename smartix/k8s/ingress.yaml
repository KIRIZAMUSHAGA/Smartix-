apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vibe-coding-ingress
  namespace: vibe-coding
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-burst: "200"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/use-gzip: "true"
    nginx.ingress.kubernetes.io/gzip-types: "application/json application/javascript text/css text/html"
spec:
  tls:
  - hosts:
    - vibe-coding.smartix.com
    - api.vibe-coding.smartix.com
    secretName: vibe-coding-tls
  rules:
  - host: vibe-coding.smartix.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vibe-coding-frontend
            port:
              number: 3000
  - host: api.vibe-coding.smartix.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vibe-coding-api
            port:
              number: 8000
      - path: /sandbox
        pathType: Prefix
        backend:
          service:
            name: vibe-coding-api
            port:
              number: 8080
